name: Build and test

on:
  push:
    branches-ignore:
     - gh-pages
  schedule:
    - cron: 0 10 * * 1  # 3AM PST
  workflow_dispatch:

jobs:
  lint:
    name: Lint the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          environments: dev
      - name: Lint
        run: pixi run -e dev lint

  test:
    name: Run tests on ${{ matrix.environment }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pixi environments, one per supported Python version
        environment: [py311, py312, py313]
        os: [ubuntu-latest]
        include:
          - environment: py312
            os: macos-latest
          - environment: py312
            os: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          environments: ${{ matrix.environment }}
      - name: Test CLI
        run: pixi run -e ${{ matrix.environment }} python -m canopy_factory -h
      - name: Run tests
        run: pixi run -e ${{ matrix.environment }} test -sv --log-cli-level=INFO

  # Disable this or limit to ubuntu once it is verified to work on all jobs?
  build:
    name: Run build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          environments: dev
      - name: Build a binary wheel and a source tarball
        run: pixi run -e dev python -m build

  docs:
    name: Build the docs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-tags: true
    - name: Set up pixi
      uses: prefix-dev/setup-pixi@v0.11.2
      with:
        environments: docs
    - name: Build the docs
      run: pixi run -e docs docs
    - name: Run doctests
      run: pixi run -e docs doctest

  all_tests_passed:
    runs-on: ubuntu-latest
    name: All tests passed
    needs: [lint, test, docs, build]
    if: always()
    steps:
      - name: All tests ok
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: Some tests failed
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
