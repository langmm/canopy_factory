[bdist_wheel]
universal = 1

[build-system]
requires = [
  "setuptools >= 61.0",
  "setuptools_scm",
]
build-backend = "setuptools.build_meta"

[project]
name = "canopy_factory"
dynamic = [
  "version",
  "readme",
]
# conda_dependencies = [
#   "ffmpeg",
#   "openalea.lpy",
#   "yggdrasil",
#   "ePhotosynthesis_C", (or "sundials>=5.7.0" if building),
# ]
dependencies = [
  "hothouse>=0.1.0",
  "imageio",
  "matplotlib>=3.10.0",
  "numpy>=1.13.0",
  "pandas",
  "pvlib>=0.7.2",
  "pydantic>=2.0",
  "pyshp",
  "pyyaml",
  "scipy",
  "simulatr",
  "yggdrasil-python-rapidjson",
]
description = "Tool for generating and utilizing 3D meshes for simulated canopies"
license-files = ["LICEN[CS]E*"]
license = "GPL-3.0-or-later"
keywords = [
  "models", "plants", "simulation", "canopy_factory", "CROPPS",
]
authors = [
  { name="Meagan Lang", email="langmm.astro@gmail.com" },
]
maintainers = [
  { name="Meagan Lang", email="langmm.astro@gmail.com" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Topic :: Scientific/Engineering",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  # "Programming Language :: Python :: 3.13",
  # "Programming Language :: Python :: 3.14",
]
requires-python = ">= 3.11"

# [project.scripts]
# canopy_factory = "canopy_factory.cli:parse_args"

[project.entry-points]
console_scripts = { canopy_factory="canopy_factory.cli:main" }

[project.urls]
Homepage = "https://github.com/langmm/canopy_factory"
Documentation = "https://github.com/langmm/canopy_factory"
Repository = "https://github.com/langmm/canopy_factory"
Issues = "https://github.com/langmm/canopy_factory/issues"
Changelog = "https://github.com/langmm/canopy_factory/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
  'pytest>=8.4',
  'pytest-cov>=4.1',
]
docs = [
  'sphinx>=7.2',
  'myst-parser>=2.0',
  'numpydoc>=1.6',
  'sphinx-copybutton>=0.5',
  'sphinx-book-theme>=1.1',
]
dev = [
  'flake8',
  'git-changelog',
]

[tool.setuptools]
include-package-data = true
packages = ["canopy_factory"]

[tool.setuptools.dynamic]
readme = {file = "README.md", content-type = "text/markdown"}

[tool.setuptools_scm]
version_file = "canopy_factory/_version.py"
scm.git.describe_command = "git describe --tags --abbrev=0"

[tool.pytest.ini_options]
minversion = "6.0"
norecursedirs = [
  ".*", "build", "dist", "CVS", "_darcs", "{arch}", "*.egg",
  "scripts", "utils", "embree",
]
testpaths = "tests"
addopts = "--disable-plugin-autoload"
# -p no:yggdrasil-framework"
filterwarnings = [
  "error",
  "ignore:((.|\n)*)No class for parameter \"LeafArea\"((.|\n)*)",
  # Errors from traittypes import in hothouse
  "ignore:((.|\n)*)Sentinel is not a public part of the traitlets API((.|\n)*)",
  "ignore:((.|\n)*)was set from the constructor((.\n)*)",
  # Error from pvlib import
  "ignore:((.|\n)*)Implicit None on return values is deprecated and will raise KeyErrors((.\n)*)",
  # Error from pandas use of tzinfo
  "ignore:((.|\n)*)datetime\\.datetime\\.utcfromtimestamp((.|\n)*):DeprecationWarning:pytz.*",
  "ignore:((.|\n)*)datetime\\.datetime\\.utcfromtimestamp((.|\n)*):DeprecationWarning:pandas.*",
  "ignore:((.|\n)*)datetime\\.datetime\\.utcfromtimestamp((.|\n)*):DeprecationWarning:dateutil.*",
  "ignore:((.|\n)*)will be accessed as an attribute((.|\n)*):FutureWarning:earthaccess.*",
  # Error from matplotlib use of timedelta
  "ignore:((.|\n)*)unit for NumPy timedelta is deprecated((.|\n)*):DeprecationWarning:matplotlib.*",
]

[tool.coverage.run]
omit = [
  # "*/python?.?/*",
  "*/lib-python/?.?/*.py",
  "*/lib_pypy/_*.py",
  "*/site-packages/ordereddict.py",
  "*/site-packages/nose/*",
  "*/unittest2/*",
]

[tool.coverage.report]
sort = "Cover"
ignore_errors = true
show_missing = true
exclude_lines = [
  "pragma: Python 3.8",
  "pragma: no cover",
  "pragma: debug",
  "pragma: in progress",
  "pragma: config",
  "pragma: completion",
  "pragma: testing",
  "pragma: version",
  "pragma: intermittent",
  "pragma: deprecated",
  "pragma: extern",
  "def __repr__",
  "def description_prefix",
  "if 0:",
  "if False:",
  "if __name__ == .__main__.:",
]

[tool.cibuildwheel]
test-requires = ["pytest"]
test-command = "pytest -m {project}/tests"
# Based on embreex values
skip = "*i686 *-win32 *musllinux*"
manylinux-x86_64-image = "manylinux_2_28"

[tool.black]
line-length = 88
target-version = ['py311', 'py312']  # , 'py313']  #, 'py314']
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | _version\.py
)/
'''

[tool.git-changelog]
# Custom template based on the builtin "keepachangelog" one, extended to also
# render commits that the "basic" convention cannot classify (e.g. subjects that
# don't start with add/fix/change/remove/merge/doc) under a trailing "Misc"
# section, so refactors and other uncategorized commits are never dropped.
template = "path:changelog.md.jinja"
bump = "auto"
output = "CHANGELOG.md"
in-place = true